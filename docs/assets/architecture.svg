<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="540" viewBox="0 0 1240 540" role="img" aria-labelledby="title">
<title id="title">SplatStudio: installable methods and traceable Gaussian splatting experiments</title>
<defs><radialGradient id="splat"><stop stop-color="#98ffe0" stop-opacity=".8"/><stop offset="1" stop-color="#5ed9bc" stop-opacity="0"/></radialGradient></defs>
<rect width="1240" height="540" rx="24" fill="#f7f9fc"/>
<g font-family="Inter, DejaVu Sans, Arial, sans-serif"><text x="40" y="52" font-size="27" fill="#17243a" font-weight="700">A method is a package. An experiment leaves evidence.</text><text x="40" y="83" font-size="15" fill="#596b80" font-weight="400">The native SDK and the Nerfstudio research collection are separate, interoperable entry points.</text><rect x="40" y="128" width="260" height="225" rx="16" fill="white" stroke="#d7e0e8"/><rect x="58" y="148" width="224" height="29" rx="8" fill="#e7e5ff"/><text x="70" y="168" font-size="11" fill="#34465c" font-weight="700">01  CREATE</text><text x="58" y="215" font-size="19" fill="#17243a" font-weight="700">Your Python package</text><text x="58" y="253" font-size="13" fill="#4e6077" font-weight="400">MethodSpec</text><text x="58" y="281" font-size="13" fill="#4e6077" font-weight="400">Renderer + density + losses</text><text x="58" y="309" font-size="13" fill="#4e6077" font-weight="400">Custom fields and probes</text><path d="M310 240 h20 l-5 -5 m5 5 l-5 5" fill="none" stroke="#6d819b" stroke-width="2"/><rect x="340" y="128" width="260" height="225" rx="16" fill="white" stroke="#d7e0e8"/><rect x="358" y="148" width="224" height="29" rx="8" fill="#d9f4e9"/><text x="370" y="168" font-size="11" fill="#34465c" font-weight="700">02  EXECUTE</text><text x="358" y="215" font-size="19" fill="#17243a" font-weight="700">Native SplatStudio</text><text x="358" y="253" font-size="13" fill="#4e6077" font-weight="400">3D / 2D gsplat rasterization</text><text x="358" y="281" font-size="13" fill="#4e6077" font-weight="400">Gradient-aware density control</text><text x="358" y="309" font-size="13" fill="#4e6077" font-weight="400">CUDA train + checkpoint + eval</text><path d="M610 240 h20 l-5 -5 m5 5 l-5 5" fill="none" stroke="#6d819b" stroke-width="2"/><rect x="640" y="128" width="260" height="225" rx="16" fill="white" stroke="#d7e0e8"/><rect x="658" y="148" width="224" height="29" rx="8" fill="#fff0da"/><text x="670" y="168" font-size="11" fill="#34465c" font-weight="700">03  CHECK</text><text x="658" y="215" font-size="19" fill="#17243a" font-weight="700">Executable evidence</text><text x="658" y="253" font-size="13" fill="#4e6077" font-weight="400">Capabilities and dependencies</text><text x="658" y="281" font-size="13" fill="#4e6077" font-weight="400">Topology and optimizer state</text><text x="658" y="309" font-size="13" fill="#4e6077" font-weight="400">Independent mechanism probes</text><path d="M910 240 h20 l-5 -5 m5 5 l-5 5" fill="none" stroke="#6d819b" stroke-width="2"/><rect x="940" y="128" width="260" height="225" rx="16" fill="white" stroke="#d7e0e8"/><rect x="958" y="148" width="224" height="29" rx="8" fill="#e2edff"/><text x="970" y="168" font-size="11" fill="#34465c" font-weight="700">04  REPORT</text><text x="958" y="215" font-size="19" fill="#17243a" font-weight="700">Reviewable results</text><text x="958" y="253" font-size="13" fill="#4e6077" font-weight="400">Source and dataset hashes</text><text x="958" y="281" font-size="13" fill="#4e6077" font-weight="400">Per-view quality + resources</text><text x="958" y="309" font-size="13" fill="#4e6077" font-weight="400">Signed, absolute, worst gaps</text><rect x="40" y="386" width="560" height="118" rx="16" fill="#17243a"/><text x="62" y="416" font-size="11" fill="#8ce4ca" font-weight="700">NERFSTUDIO COLLECTION</text><text x="62" y="447" font-size="19" fill="#f4f6fc" font-weight="600">33 installable research configurations</text><text x="62" y="477" font-size="13" fill="#c1ccdc" font-weight="400">pip install -e packages/nerfstudio-methods → ns-train ss-absgs</text><rect x="640" y="386" width="560" height="118" rx="16" fill="#eff3f7" stroke="#d7e0e8"/><text x="662" y="418" font-size="11" fill="#596b80" font-weight="700">STATUS HAS A PRECISE MEANING</text><text x="662" y="449" font-size="17" fill="#17243a" font-weight="600">Import → short training → mechanism tests → reproduction</text><text x="662" y="478" font-size="13" fill="#596b80" font-weight="400">Each stage needs its own evidence. Passing one does not establish the next.</text></g></svg>
