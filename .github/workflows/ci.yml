name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install CPU test environment
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          BUILD_NO_CUDA=1 pip install --no-build-isolation gsplat==1.5.3
          pip install -e '.[runtime,data,dev]'
      - name: Check SDK and repository
        run: |
          ruff check src tests examples scripts
          pytest -q
          python scripts/check_repository.py
          python -m compileall -q packages/nerfstudio-methods/splatstudio_zoo
      - name: Check package builds and external discovery
        run: |
          pip wheel --no-deps . -w dist
          pip wheel --no-deps packages/nerfstudio-methods -w dist
          pip install -e examples/scale_prior
          ss-inspect scale-prior
          ss-methods --catalog
          ss-verify gsplat-surfel --static-only
