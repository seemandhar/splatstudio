[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-ms-gs"
version = "0.1.0"
description = "Multi-Scale 3D Gaussian Splatting (arXiv 2311.17089) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
ms-gs = "ss_ms_gs:method"

[tool.setuptools.package-data]
ss_ms_gs = ["csrc/*.cu"]

[tool.setuptools.packages.find]
include = ["ss_ms_gs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
