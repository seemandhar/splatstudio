[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-improving-adc"
version = "0.1.0"
description = "Improving ADC for 3DGS (arXiv 2503.14274) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
improving-adc = "ss_improving_adc:method"

[tool.setuptools.packages.find]
include = ["ss_improving_adc*"]

[tool.setuptools.package-data]
ss_improving_adc = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
