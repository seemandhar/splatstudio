[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-beta-splatting"
version = "0.1.0"
description = "Deformable Beta Splatting (arXiv 2501.18630) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio"]

[project.entry-points."splatstudio.methods"]
beta-splatting = "ss_beta_splatting:beta_splatting"
beta-splatting-garden = "ss_beta_splatting:beta_splatting_garden"
beta-splatting-room = "ss_beta_splatting:beta_splatting_room"
beta-splatting-bicycle = "ss_beta_splatting:beta_splatting_bicycle"

[tool.setuptools]
packages = ["ss_beta_splatting"]

[tool.setuptools.package-data]
ss_beta_splatting = ["csrc/*.cu", "csrc/*.cpp"]

[tool.ruff]
line-length = 100
