[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-dofgs"
version = "0.1.0"
description = "DOF-GS (arXiv 2405.17351) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
dofgs = "ss_dofgs:method"
dofgs-bl-m001 = "ss_dofgs:method_bl_m001"
dofgs-nobl = "ss_dofgs:method_nobl"

[tool.setuptools.packages.find]
include = ["ss_dofgs*"]

[tool.setuptools.package-data]
ss_dofgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_dofgs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
