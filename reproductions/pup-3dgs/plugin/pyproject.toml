[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-pup-3dgs"
version = "0.1.0"
description = "PUP 3D-GS (arXiv 2406.10219) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
pup-3dgs = "ss_pup3dgs:method"
pup-3dgs-v1 = "ss_pup3dgs:v1"

[tool.setuptools.packages.find]
include = ["ss_pup3dgs*"]

[tool.setuptools.package-data]
ss_pup3dgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
