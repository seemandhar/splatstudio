[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-opti3dgs"
version = "0.1.0"
description = "Opti3DGS (arXiv 2503.14475) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
opti3dgs = "ss_opti3dgs:method"
opti3dgs-filter = "ss_opti3dgs:method_filter"

[tool.setuptools.packages.find]
include = ["ss_opti3dgs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
