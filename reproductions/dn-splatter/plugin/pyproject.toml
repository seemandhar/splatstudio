[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-dn-splatter"
version = "0.1.0"
description = "DN-Splatter (arXiv 2403.17822) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
dn-splatter = "ss_dnsplatter:method"
dn-splatter-rgb = "ss_dnsplatter:method_rgb"
dn-splatter-splatfacto = "ss_dnsplatter:method_splatfacto"

[tool.setuptools.packages.find]
include = ["ss_dnsplatter*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
