[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-c3dgs"
version = "0.1.0"
description = "Compressed 3DGS (Niedermayr et al., CVPR 2024, arXiv 2401.02436) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "numpy"]

[project.entry-points."splatstudio.methods"]
c3dgs = "ss_c3dgs:method"
c3dgs-smoke = "ss_c3dgs:smoke"

[tool.setuptools.packages.find]
include = ["ss_c3dgs*"]

[tool.setuptools.package-data]
ss_c3dgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
