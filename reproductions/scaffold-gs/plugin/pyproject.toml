[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-scaffold-gs"
version = "0.1.0"
description = "Scaffold-GS (Lu et al., CVPR 2024) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
scaffold-gs = "ss_scaffold_gs:method"
scaffold-gs-tandt = "ss_scaffold_gs:method_tandt"
scaffold-gs-db = "ss_scaffold_gs:method_db"

[tool.setuptools.packages.find]
include = ["ss_scaffold_gs*"]

[tool.setuptools.package-data]
ss_scaffold_gs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ss_scaffold_gs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
