[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-improving-densification"
version = "0.1.0"
description = "ImprovedGS / Improving Densification in 3DGS (arXiv 2508.12313) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
improving-densification = "ss_improving_densification:method"

[tool.setuptools.packages.find]
include = ["ss_improving_densification*"]

[tool.setuptools.package-data]
ss_improving_densification = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_improving_densification/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
