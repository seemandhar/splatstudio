[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-deblurring-3dgs"
version = "0.1.0"
description = "Deblurring 3D Gaussian Splatting (arXiv 2401.00834) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
deblurring-3dgs-defocus = "ss_deblurring_3dgs:method_defocus"
deblurring-3dgs-motion = "ss_deblurring_3dgs:method_motion"

[tool.setuptools.packages.find]
include = ["ss_deblurring_3dgs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
