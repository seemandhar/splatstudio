[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-pixel-gs"
version = "0.1.0"
description = "Pixel-GS (arXiv 2403.15530) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
pixel-gs = "ss_pixel_gs:method"
pixel-gs-pixel-only = "ss_pixel_gs:method_pixel_only"
pixel-gs-depth-only = "ss_pixel_gs:method_depth_only"

[tool.setuptools.packages.find]
include = ["ss_pixel_gs*"]

[tool.setuptools.package-data]
ss_pixel_gs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
