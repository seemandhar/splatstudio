[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-sugar"
version = "0.1.0"
description = "SuGaR (arXiv 2311.12775) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "scipy"]

[project.entry-points."splatstudio.methods"]
sugar = "ss_sugar:method"
sugar-smoke = "ss_sugar:smoke"

[tool.setuptools.packages.find]
include = ["ss_sugar*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
