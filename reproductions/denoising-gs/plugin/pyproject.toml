[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-denoising-gs"
version = "0.1.0"
description = "Denoising-GS (arXiv 2605.14880) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "scipy"]

[project.entry-points."splatstudio.methods"]
denoising-gs = "ss_denoising_gs:method"
denoising-gs-mcmc = "ss_denoising_gs:mcmc_control"
denoising-gs-quick = "ss_denoising_gs:quick"

[tool.setuptools.packages.find]
include = ["ss_denoising_gs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
