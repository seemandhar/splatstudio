[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-steepgs"
version = "0.1.0"
description = "SteepGS (arXiv 2505.05587) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
steepgs = "ss_steepgs:method"
steepgs-adc = "ss_steepgs:adc_control"

[tool.setuptools.packages.find]
include = ["ss_steepgs*"]

[tool.setuptools.package-data]
ss_steepgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_steepgs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
