[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-fast-gs"
version = "0.1.0"
description = "FastGS (arXiv 2511.04283) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
fast-gs = "ss_fast_gs:method"
fast-gs-big = "ss_fast_gs:big"
fast-gs-tdb = "ss_fast_gs:tdb"
fast-gs-big-tdb = "ss_fast_gs:big_tdb"

[tool.setuptools.packages.find]
include = ["ss_fast_gs*"]

[tool.setuptools.package-data]
ss_fast_gs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_fast_gs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
