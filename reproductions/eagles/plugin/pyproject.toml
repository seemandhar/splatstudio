[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-eagles"
version = "0.1.0"
description = "EAGLES (Girish et al., ECCV 2024) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "constriction>=0.4"]

[project.entry-points."splatstudio.methods"]
eagles = "ss_eagles:method"

[tool.setuptools.packages.find]
include = ["ss_eagles*"]

[tool.setuptools.package-data]
ss_eagles = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
