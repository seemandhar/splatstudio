[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-3dgut"
version = "0.1.0"
description = "3DGUT (arXiv 2412.12507) native SplatStudio port on gsplat's UT/eval3d kernels; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
3dgut = "ss_3dgut:method"

[tool.setuptools.packages.find]
include = ["ss_3dgut*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
