[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-hierarchical-3dgs"
version = "0.1.0"
description = "Hierarchical 3DGS (arXiv 2406.12080) single-chunk native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
hierarchical-3dgs = "ss_hierarchical_3dgs:method"
hierarchical-3dgs-quick = "ss_hierarchical_3dgs:quick"

[tool.setuptools.packages.find]
include = ["ss_hierarchical_3dgs*"]

[tool.setuptools.package-data]
ss_hierarchical_3dgs = ["csrc/*", "vendor/*.md", "vendor/hierarchy_rasterizer/**/*", "vendor/gaussian_hierarchy/**/*", "vendor/third_party/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_hierarchical_3dgs/vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
