[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-loss-aware-dc"
version = "0.1.0"
description = "Unified Loss-Aware Density Control (arXiv 2611.02044) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
loss-aware-dc = "ss_loss_aware_dc:method"

[tool.setuptools.packages.find]
include = ["ss_loss_aware_dc*"]

[tool.setuptools.package-data]
ss_loss_aware_dc = ["csrc/*.cu"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
