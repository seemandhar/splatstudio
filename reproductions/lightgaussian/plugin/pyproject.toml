[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-lightgaussian"
version = "0.1.0"
description = "LightGaussian (arXiv 2311.17245) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
lightgaussian = "ss_lightgaussian:method"
lightgaussian-released = "ss_lightgaussian:released"
lightgaussian-smoke = "ss_lightgaussian:smoke"

[tool.setuptools.packages.find]
include = ["ss_lightgaussian*"]

[tool.setuptools.package-data]
ss_lightgaussian = ["csrc/*.cu", "csrc/*.cpp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
