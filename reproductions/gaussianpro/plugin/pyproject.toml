[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-gaussianpro"
version = "0.1.0"
description = "GaussianPro (arXiv 2402.14650) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
gaussianpro = "ss_gaussianpro:method"

[tool.setuptools.packages.find]
include = ["ss_gaussianpro*"]

[tool.setuptools.package-data]
ss_gaussianpro = ["csrc/*.md", "csrc/propagation/*", "csrc/simple_knn/*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["ss_gaussianpro/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
