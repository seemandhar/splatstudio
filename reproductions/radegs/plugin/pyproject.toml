[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-radegs"
version = "0.1.0"
description = "RaDe-GS (arXiv 2406.01467) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
radegs = "ss_radegs:method"

[tool.setuptools.packages.find]
include = ["ss_radegs*"]

[tool.setuptools.package-data]
ss_radegs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*", "csrc/third_party/glm/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_radegs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
