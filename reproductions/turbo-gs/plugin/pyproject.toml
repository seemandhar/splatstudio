[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-turbo-gs"
version = "0.1.0"
description = "Turbo-GS (arXiv 2412.13547) Turbo-3DGS native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
turbo-gs = "ss_turbo_gs:method"

[tool.setuptools.packages.find]
include = ["ss_turbo_gs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
