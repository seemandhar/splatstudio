[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-mh-3dgs"
version = "0.1.0"
description = "MH-3DGS (Metropolis-Hastings Sampling for 3D Gaussian Reconstruction, arXiv 2506.12945) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
mh-3dgs = "ss_mh_3dgs:method"
mh-3dgs-mcmc-control = "ss_mh_3dgs:mcmc_control"

[tool.setuptools.packages.find]
include = ["ss_mh_3dgs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
