[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-stablegs"
version = "0.1.0"
description = "StableGS (arXiv 2503.18458) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "splatstudio-method-taming-3dgs"]

[project.entry-points."splatstudio.methods"]
stablegs = "ss_stablegs:method"
stablegs-paper-consis = "ss_stablegs:method_paper_consistency"

[tool.setuptools.packages.find]
include = ["ss_stablegs*"]

[tool.setuptools.package-data]
ss_stablegs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*", "csrc/third_party/glm/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_stablegs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
