[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-2dgs"
version = "0.1.0"
description = "2DGS (arXiv 2403.17888) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
2dgs = "ss_twodgs:method"
2dgs-paperdist = "ss_twodgs:method_paperdist"

[tool.setuptools.packages.find]
include = ["ss_twodgs*"]

[tool.setuptools.package-data]
ss_twodgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/SHA256SUMS", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_twodgs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
