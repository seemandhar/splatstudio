[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-efficientgs"
version = "0.1.0"
description = "EfficientGS (arXiv 2404.12777) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
efficientgs = "ss_efficientgs:method"

[tool.setuptools.packages.find]
include = ["ss_efficientgs*"]

[tool.setuptools.package-data]
ss_efficientgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
