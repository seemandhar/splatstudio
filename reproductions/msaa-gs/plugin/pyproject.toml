[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-msaa-gs"
version = "0.1.0"
description = "MSAA-GS (arXiv 2508.10507) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio"]

[project.entry-points."splatstudio.methods"]
msaa-gs = "ss_msaa_gs:msaa_gs"
msaa-gs-msaa-only = "ss_msaa_gs:msaa_only"
msaa-gs-aws-gdc-only = "ss_msaa_gs:aws_gdc_only"
msaa-gs-it1 = "ss_msaa_gs:msaa_gs_it1"

[tool.setuptools]
packages = ["ss_msaa_gs"]

[tool.setuptools.package-data]
ss_msaa_gs = ["csrc/*.cu", "csrc/*.cpp"]

[tool.ruff]
line-length = 100
