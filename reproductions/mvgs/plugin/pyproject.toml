[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-mvgs"
version = "0.1.0"
description = "MVGS (arXiv 2410.02103) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
mvgs = "ss_mvgs:method"
mvgs-outdoor = "ss_mvgs:method_outdoor"

[tool.setuptools.packages.find]
include = ["ss_mvgs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
