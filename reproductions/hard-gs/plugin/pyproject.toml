[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-hard-gs"
version = "0.1.0"
description = "HGS: Hard Gaussian Splatting (Xu et al., CVPR 2025) native SplatStudio port on a Scaffold-GS backbone; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
hard-gs = "ss_hard_gs:method"
hard-gs-tandt = "ss_hard_gs:method_tandt"
hard-gs-db = "ss_hard_gs:method_db"
scaffold-gs-hgsbase = "ss_hard_gs:method_scaffold"

[tool.setuptools.packages.find]
include = ["ss_hard_gs*"]

[tool.setuptools.package-data]
ss_hard_gs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_hard_gs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
