[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-analytic-splatting"
version = "0.1.0"
description = "Analytic-Splatting (arXiv 2403.11056) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
analytic-splatting = "ss_analytic_splatting:method"

[tool.setuptools.packages.find]
include = ["ss_analytic_splatting*"]

[tool.setuptools.package-data]
ss_analytic_splatting = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_analytic_splatting/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
