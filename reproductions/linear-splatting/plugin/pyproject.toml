[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-3dls"
version = "0.1.0"
description = "3D Linear Splatting (arXiv 2411.12440) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio"]

[project.entry-points."splatstudio.methods"]
3dls = "ss_linear_splatting:linear_splatting"
3dls-noags = "ss_linear_splatting:linear_splatting_noags"
3dls-aags = "ss_linear_splatting:linear_splatting_aligned_ags"

[tool.setuptools]
packages = ["ss_linear_splatting"]

[tool.setuptools.package-data]
ss_linear_splatting = ["csrc/*.cu", "csrc/*.cpp"]

[tool.ruff]
line-length = 100
