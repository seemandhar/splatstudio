[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-coherentgs"
version = "0.1.0"
description = "CoherentGS (ECCV 2024, arXiv 2403.19495) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "gsplat>=1.5", "numpy"]

[project.entry-points."splatstudio.methods"]
coherentgs = "ss_coherentgs:method"

[tool.setuptools.packages.find]
include = ["ss_coherentgs*"]

[tool.ruff]
line-length = 110
