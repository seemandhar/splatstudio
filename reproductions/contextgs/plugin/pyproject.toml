[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-contextgs"
version = "0.1.0"
description = "ContextGS (Wang et al., NeurIPS 2024) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
contextgs = "ss_contextgs:method"

[tool.setuptools.packages.find]
include = ["ss_contextgs*"]

[tool.setuptools.package-data]
ss_contextgs = ["csrc/*/*.cu", "csrc/*/*.cpp", "csrc/*/*.h", "csrc/*.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["ss_contextgs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
