[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-trimgs"
version = "0.1.0"
description = "Trim3DGS (arXiv 2406.07499) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "scipy"]

[project.entry-points."splatstudio.methods"]
trimgs = "ss_trimgs:method"
trimgs-indoor = "ss_trimgs:indoor"

[tool.setuptools.packages.find]
include = ["ss_trimgs*"]

[tool.setuptools.package-data]
ss_trimgs = ["csrc/*.cu", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
