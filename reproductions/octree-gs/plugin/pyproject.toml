[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-octree-gs"
version = "0.1.0"
description = "Octree-GS (Ren et al., TPAMI 2025) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
octree-gs = "ss_octree_gs:method"

[tool.setuptools.packages.find]
include = ["ss_octree_gs*"]

[tool.setuptools.package-data]
ss_octree_gs = ["csrc/*/*.cu", "csrc/*/*.cpp", "csrc/*/*.h", "csrc/*/*.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["ss_octree_gs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
