[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-det-gs"
version = "0.1.0"
description = "DET-GS (arXiv 2508.04099) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "gsplat>=1.5", "numpy"]

[project.entry-points."splatstudio.methods"]
det-gs = "ss_det_gs:method"

[tool.setuptools.packages.find]
include = ["ss_det_gs*"]

[tool.ruff]
line-length = 110
