[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-gaussian-surfels"
version = "0.1.0"
description = "Gaussian Surfels (arXiv 2404.17774) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
gaussian-surfels = "ss_gsurfels:method"
gaussian-surfels-nogeo = "ss_gsurfels:method_nogeo"

[project.scripts]
gsurfels-dtu-eval = "ss_gsurfels.dtu:main"

[tool.setuptools.packages.find]
include = ["ss_gsurfels*"]

[tool.setuptools.package-data]
ss_gsurfels = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/SHA256SUMS", "csrc/cuda_rasterizer/*", "csrc/utils/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
