[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-gs-ir"
version = "0.1.0"
description = "GS-IR (arXiv 2311.16473) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
gs-ir = "ss_gsir:method"
gs-ir-smoke = "ss_gsir:method_smoke"

[tool.setuptools.packages.find]
include = ["ss_gsir*"]

[tool.setuptools.package-data]
ss_gsir = ["csrc/*.cu", "data/*.bin"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
