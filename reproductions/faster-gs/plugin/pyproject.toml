[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-faster-gs"
version = "0.1.0"
description = "Faster-GS (arXiv 2602.09999) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
faster-gs = "ss_faster_gs:method"

[tool.setuptools.packages.find]
include = ["ss_faster_gs*"]

[tool.setuptools.package-data]
ss_faster_gs = ["csrc/LICENSE", "csrc/*.cpp", "csrc/*/include/*", "csrc/*/src/*", "csrc/utils/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_faster_gs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
