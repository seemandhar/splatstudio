[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-erank-gs"
version = "0.1.0"
description = "Effective Rank Regularization for 3DGS (arXiv 2406.11672) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
erank-gs = "ss_erank_gs:method"
erank-gs-adc = "ss_erank_gs:method_adc"
erank-gs-3dgs = "ss_erank_gs:method_3dgs"

[tool.setuptools.packages.find]
include = ["ss_erank_gs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
