[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-splatfields"
version = "0.1.0"
description = "SplatFields (Mihajlovic et al., ECCV 2024) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
splatfields = "ss_splatfields:method"
splatfields-3dgs = "ss_splatfields:method_3dgs"

[tool.setuptools.packages.find]
include = ["ss_splatfields*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
