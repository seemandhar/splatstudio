[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-sog"
version = "0.1.0"
description = "Self-Organizing Gaussians (Morgenstern et al., ECCV 2024) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
# plas: pip install --no-deps "git+https://github.com/fraunhoferhhi/PLAS.git@782a3ae8adf5223ece31aa4ea97fc5e66931180a"
# JPEG XL codec: isolated env, see install_codec_env.sh (imagecodecs==2023.9.18 needs numpy<2)
dependencies = ["splatstudio>=0.1,<0.2", "plas", "kornia", "pyyaml"]

[project.entry-points."splatstudio.methods"]
sog = "ss_sog:method"
sog-smoke = "ss_sog:smoke"

[tool.setuptools.packages.find]
include = ["ss_sog*"]

[tool.setuptools.package-data]
ss_sog = ["*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
