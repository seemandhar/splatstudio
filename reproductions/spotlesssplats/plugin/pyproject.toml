[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-spotlesssplats"
version = "0.1.0"
description = "SpotLessSplats (arXiv 2406.20055) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "gsplat>=1.5", "numpy"]

[project.entry-points."splatstudio.methods"]
spotlesssplats = "ss_spotlesssplats:method"
spotlesssplats-noubp = "ss_spotlesssplats:method_noubp"
spotlesssplats-agg = "ss_spotlesssplats:method_agg"

[tool.setuptools.packages.find]
include = ["ss_spotlesssplats*"]

[tool.setuptools.package-data]
ss_spotlesssplats = ["csrc/*.cu", "csrc/*.cpp"]

[tool.ruff]
line-length = 100
