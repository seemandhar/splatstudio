[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-pgsr"
version = "0.1.0"
description = "PGSR (arXiv 2406.06521) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
pgsr = "ss_pgsr:method"
pgsr-tnt = "ss_pgsr:method_tnt"

[tool.setuptools.packages.find]
include = ["ss_pgsr*"]

[tool.setuptools.package-data]
ss_pgsr = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/*.h", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_pgsr/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
