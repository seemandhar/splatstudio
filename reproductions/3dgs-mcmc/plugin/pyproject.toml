[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-mcmc-3dgs"
version = "0.1.0"
description = "3D Gaussian Splatting as Markov Chain Monte Carlo (arXiv 2404.09591) faithful native config: gsplat MCMCStrategy + official recipe; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
mcmc-3dgs = "ss_mcmc_3dgs:method"

[tool.setuptools.packages.find]
include = ["ss_mcmc_3dgs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
