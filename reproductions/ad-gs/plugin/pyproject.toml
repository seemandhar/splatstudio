[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-ad-gs"
version = "0.1.0"
description = "AD-GS (arXiv 2509.11003) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "gsplat>=1.5", "numpy"]

[project.entry-points."splatstudio.methods"]
ad-gs = "ss_ad_gs:method"

[tool.setuptools.packages.find]
include = ["ss_ad_gs*"]

[tool.ruff]
line-length = 100
