[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-litegs"
version = "0.1.0"
description = "LiteGS (arXiv 2503.01199) native SplatStudio port of the algorithmic parts; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
litegs = "ss_litegs:method"

[tool.setuptools.packages.find]
include = ["ss_litegs*"]

[tool.setuptools.package-data]
ss_litegs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
