[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-aaa-gaussians"
version = "0.1.0"
description = "AAA-Gaussians (arXiv 2504.12811) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
aaa-gaussians = "ss_aaa_gaussians:method"

[tool.setuptools.packages.find]
include = ["ss_aaa_gaussians*"]

[tool.setuptools.package-data]
ss_aaa_gaussians = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/**/*", "csrc/third_party/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_aaa_gaussians/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
