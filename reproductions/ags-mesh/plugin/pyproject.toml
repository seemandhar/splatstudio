[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-ags-mesh"
version = "0.1.0"
description = "AGS-Mesh (arXiv 2411.19271) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
ags-mesh = "ss_agsmesh:method"
ags-mesh-rgb = "ss_agsmesh:method_rgb"

[tool.setuptools.packages.find]
include = ["ss_agsmesh*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
