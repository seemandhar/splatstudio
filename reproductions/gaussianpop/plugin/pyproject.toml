[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-gaussianpop"
version = "0.1.0"
description = "GaussianPOP (arXiv 2602.06830) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
gaussianpop = "ss_gaussianpop:method"
gaussianpop-p07 = "ss_gaussianpop:p07"
gaussianpop-p09 = "ss_gaussianpop:p09"

[tool.setuptools.packages.find]
include = ["ss_gaussianpop*"]

[tool.setuptools.package-data]
ss_gaussianpop = ["csrc/*.cu", "csrc/*.cpp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
