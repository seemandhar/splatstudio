[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-lp-3dgs"
version = "0.1.0"
description = "LP-3DGS (arXiv 2405.18784) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
lp-3dgs = "ss_lp_3dgs:method"

[tool.setuptools.packages.find]
include = ["ss_lp_3dgs*"]

[tool.setuptools.package-data]
ss_lp_3dgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
