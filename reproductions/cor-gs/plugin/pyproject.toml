[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-cor-gs"
version = "0.1.0"
description = "CoR-GS (arXiv 2405.12110) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "gsplat>=1.5", "numpy"]

[project.entry-points."splatstudio.methods"]
cor-gs = "ss_corgs:method"
cor-gs-single = "ss_corgs:method_single"

[tool.setuptools.packages.find]
include = ["ss_corgs*"]

[tool.ruff]
line-length = 100
