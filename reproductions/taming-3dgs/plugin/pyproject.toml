[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-taming-3dgs"
version = "0.1.0"
description = "Taming 3DGS (arXiv 2406.15643) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
taming-3dgs = "ss_taming_3dgs:method"
taming-3dgs-budget = "ss_taming_3dgs:budget"

[tool.setuptools.packages.find]
include = ["ss_taming_3dgs*"]

[tool.setuptools.package-data]
ss_taming_3dgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
