[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-reduced-3dgs"
version = "0.1.0"
description = "Reduced-3DGS (Papantonakis et al., I3D 2024) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "plyfile"]

[project.entry-points."splatstudio.methods"]
reduced-3dgs = "ss_reduced_3dgs:method"
reduced-3dgs-smoke = "ss_reduced_3dgs:smoke"

[tool.setuptools.packages.find]
include = ["ss_reduced_3dgs*"]

[tool.setuptools.package-data]
ss_reduced_3dgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
