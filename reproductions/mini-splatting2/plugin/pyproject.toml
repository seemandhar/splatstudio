[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-mini-splatting2"
version = "0.1.0"
description = "Mini-Splatting2 (arXiv 2411.12788v1) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
mini-splatting2 = "ss_mini_splatting2:method"
mini-splatting2-indoor = "ss_mini_splatting2:indoor"
mini-splatting2-d = "ss_mini_splatting2:dense"
mini-splatting2-d-indoor = "ss_mini_splatting2:dense_indoor"

[tool.setuptools.packages.find]
include = ["ss_mini_splatting2*"]

[tool.setuptools.package-data]
ss_mini_splatting2 = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
