[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-wildgaussians"
version = "0.1.0"
description = "WildGaussians (arXiv 2407.08447) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "gsplat>=1.5", "numpy", "lpips"]

[project.entry-points."splatstudio.methods"]
wildgaussians = "ss_wildgaussians:method"
wildgaussians-noapp = "ss_wildgaussians:method_noapp"
wildgaussians-pt = "ss_wildgaussians:method_pt"

[tool.setuptools.packages.find]
include = ["ss_wildgaussians*"]

[tool.ruff]
line-length = 100
