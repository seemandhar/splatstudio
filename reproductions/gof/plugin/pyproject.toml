[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-gof"
version = "0.1.0"
description = "Gaussian Opacity Fields (arXiv 2404.10772) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
gof = "ss_gof:method"

[tool.setuptools.packages.find]
include = ["ss_gof*"]

[tool.setuptools.package-data]
ss_gof = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_gof/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
