[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-laplacian-gs"
version = "0.1.0"
description = "Laplacian-GS (arXiv 2609.03334) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "scipy"]

[project.entry-points."splatstudio.methods"]
laplacian-gs = "ss_laplacian_gs:method"
laplacian-gs-smoke = "ss_laplacian_gs:smoke_method"

[tool.setuptools.packages.find]
include = ["ss_laplacian_gs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
