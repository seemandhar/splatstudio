[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-mip-splatting"
version = "0.1.0"
description = "Mip-Splatting (arXiv 2311.16493) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
mip-splatting = "ss_mip_splatting:method"

[tool.setuptools.packages.find]
include = ["ss_mip_splatting*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
