[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-revising-densification"
version = "0.1.0"
description = "Revising Densification in Gaussian Splatting (arXiv 2404.06109) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
revising-densification = "ss_revising_densification:method"

[tool.setuptools.packages.find]
include = ["ss_revising_densification*"]

[tool.setuptools.package-data]
ss_revising_densification = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
