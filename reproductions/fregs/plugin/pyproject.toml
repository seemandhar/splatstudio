[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-fregs"
version = "0.1.0"
description = "FreGS (arXiv 2403.06908) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
fregs = "ss_fregs:method"
fregs-fr = "ss_fregs:fregs_fr"
fregs-thr0002 = "ss_fregs:fregs_thr0002"
fregs-calib-g0003 = "ss_fregs:calib_g0003"
fregs-calib-g0004 = "ss_fregs:calib_g0004"
fregs-calib-g0005 = "ss_fregs:calib_g0005"
fregs-calib-g0006 = "ss_fregs:calib_g0006"

[tool.setuptools.packages.find]
include = ["ss_fregs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
