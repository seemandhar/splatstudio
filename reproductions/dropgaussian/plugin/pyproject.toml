[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-dropgaussian"
version = "0.1.0"
description = "DropGaussian (CVPR 2025, arXiv 2504.00773) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2", "gsplat>=1.5", "numpy"]

[project.entry-points."splatstudio.methods"]
dropgaussian = "ss_dropgaussian:method"
dropgaussian-nodrop = "ss_dropgaussian:method_nodrop"

[tool.setuptools.packages.find]
include = ["ss_dropgaussian*"]

[tool.ruff]
line-length = 100
