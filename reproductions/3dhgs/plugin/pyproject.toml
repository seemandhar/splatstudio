[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-3dhgs"
version = "0.1.0"
description = "3D-HGS (arXiv 2406.02720) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
3dhgs = "ss_3dhgs:method"
3dhgs-db-paper = "ss_3dhgs:deep_blending"

[tool.setuptools.packages.find]
include = ["ss_3dhgs*"]

[tool.setuptools.package-data]
ss_3dhgs = ["csrc/*.cu", "csrc/*.cpp", "csrc/*.h", "csrc/*.md", "csrc/cuda_rasterizer/*", "csrc/third_party/glm/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["ss_3dhgs/csrc"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
