[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-bogauss"
version = "0.1.0"
description = "BOGausS (arXiv 2504.01844) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
bogauss = "ss_bogauss:method"

[tool.setuptools.packages.find]
include = ["ss_bogauss*"]

[tool.setuptools.package-data]
ss_bogauss = ["csrc/*.cu", "csrc/*.cpp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
