[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "splatstudio-method-conegs"
version = "0.1.0"
description = "ConeGS (arXiv 2511.06810) native SplatStudio port; paper fidelity unverified"
requires-python = ">=3.10"
# No tiny-cuda-nn / nerfacc: the hash grid is a JIT CUDA kernel in ss_conegs/hashgrid.py and the
# nerfacc proposal estimator is ported to PyTorch in ss_conegs/ingp.py.
dependencies = ["splatstudio>=0.1,<0.2"]

[project.entry-points."splatstudio.methods"]
conegs = "ss_conegs:method"
conegs-nobudget = "ss_conegs:nobudget"
conegs-blackbg = "ss_conegs:blackbg"

[project.scripts]
ss-conegs-init = "ss_conegs.preprocess:main"

[tool.setuptools.packages.find]
include = ["ss_conegs*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
